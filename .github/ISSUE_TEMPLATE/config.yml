    url: https://github.com/AbdelmonemAwad/os-xgs-npu/discussions
    about: How to do something, whether an appliance could work - ask in the project's Discussions.
  - name: The story, the photographs and the measurements
    url: https://github.com/AbdelmonemAwad/os-xgs-npu/wiki
    about: How the project came to be, in its wiki.
