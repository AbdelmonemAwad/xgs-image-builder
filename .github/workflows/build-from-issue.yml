name: Build from a request

# Read a build request filed from docs/index.html and start the build.
#
# HOW THE PIECES FIT. The page is static and holds no credential. All it does is send the reader to
# this repository's new-issue form with a JSON block already in the body. They press Submit. This
# workflow reads that JSON and dispatches build.yml. GitHub's own issue form is what does the
# authenticating, which is why this route needs no token at all.
#
# THE PRESS CANNOT BE AUTOMATED, and that is the point of it rather than a shortcoming: the press is
# the authentication. What can be automated is everything after it, and the page does that - it
# writes a build_id into the request, this passes it to the dispatch, build.yml puts it in the run's
# name, and the page then watches for the run carrying its own id and hands over the artifact. The
# reader presses Submit once and never has to find their way back.
#
# WHAT IDENTIFIES A REQUEST IS ITS BODY, NOT A LABEL. It used to be the label, and that was a real
# defect rather than a tidier design: `issues/new?labels=build` only applies the label when the
# person opening the issue has permission to label things in the repository. A stranger's request
# arrived with no label at all, both jobs here were gated on it, and so BOTH were skipped - not even
# the decline below ran. The request was correct, the page was correct, and the answer was silence.
# So the JSON block is what says this is a request, read by the same parser that validates it, and
# an issue without one is left alone.
#
# WHY IT ONLY BUILDS FOR THE OWNER. CONTRIBUTING.md's licence position is that anyone else forks
# this and builds in their own account - their build, their artifact, their storage. Without an
# author check a stranger could open an issue here and spend the owner's Actions minutes to produce
# an image in the owner's storage. So the build is guarded, and everyone else is answered rather
# than ignored.
#
# EVERY COMMENT ENDS WITH A MARKER. The build page reads these comments back to tell the reader
# what happened to their request, and classifying them by their opening words would tie the page to
# the wording here - change a sentence and the page stops recognising its own answer. So each one
# carries `<!-- xgs-result: ... -->`, which Markdown does not render, and the page reads that.
#
# IT DOES NOT CONTAIN THE BUILD. It dispatches build.yml, which is the same workflow the Actions
# page runs, with the same inputs. There is one build and one list of valid inputs - adding a second
# copy here is how the two drift apart.

on:
  issues:
    # `opened` only. The label is no longer what triggers this, so `labeled` would do nothing but
    # run the whole thing a second time on an issue already answered - and dispatch a second build.
    types: [ opened ]

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  request:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Validated against build.yml's own option lists rather than against a copy kept here, so
      # there is nothing to drift. The issue body reaches it through the environment and never
      # through a shell word.
      - name: Read the request
        id: req
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python3 tools/read-request.py >> "$GITHUB_OUTPUT"

      # Every step below is gated on this. An ordinary issue - a bug report, a question - carries no
      # JSON block, and the right answer to one of those is nothing at all.
      - name: Say what was found
        run: |
          echo "request=${{ steps.req.outputs.request }} ok=${{ steps.req.outputs.ok }}"
          if [ '${{ steps.req.outputs.request }}' != 'true' ]; then
            echo "Not a build request. Nothing to do." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Start the build
        if: >-
          steps.req.outputs.request == 'true' &&
          steps.req.outputs.ok == 'true' &&
          github.event.issue.user.login == github.repository_owner
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run build.yml \
            --ref "${{ github.event.repository.default_branch }}" \
            -f opnsense_version="${{ steps.req.outputs.opnsense_version }}" \
            -f image_type="${{ steps.req.outputs.image_type }}" \
            -f console_speed="${{ steps.req.outputs.console_speed }}" \
            -f serial_console="${{ steps.req.outputs.serial_console }}" \
            -f project_ref="${{ steps.req.outputs.project_ref }}" \
            -f build_id="${{ steps.req.outputs.build_id }}"

      - name: It is building
        if: >-
          steps.req.outputs.request == 'true' &&
          steps.req.outputs.ok == 'true' &&
          github.event.issue.user.login == github.repository_owner
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUNS: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/build.yml
        run: |
          gh issue comment '${{ github.event.issue.number }}' --body "$(printf '%s\n' \
            "Build started: OPNsense \`${{ steps.req.outputs.opnsense_version }}\` \`${{ steps.req.outputs.image_type }}\` at \`${{ steps.req.outputs.console_speed }}\` baud, os-xgs-npu \`${{ steps.req.outputs.project_ref }}\`." \
            "" \
            "It is the newest run under [Build image](${RUNS}). The build page you filed this from is already watching for it and will hand you the download; the image is an artifact on that run and expires on its own." \
            "" \
            "It has not been booted on an appliance. Burn it and boot it before relying on it." \
            "" \
            "<!-- xgs-result: started -->")"

      # A request that is a request and is wrong. Answered with the reason, because the page that
      # filed it is sitting there waiting for a run that is never going to start.
      - name: It is malformed
        if: >-
          steps.req.outputs.request == 'true' &&
          steps.req.outputs.ok != 'true' &&
          github.event.issue.user.login == github.repository_owner
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment '${{ github.event.issue.number }}' --body "$(printf '%s\n' \
            "This request was not started." \
            "" \
            "\`\`\`" \
            "${{ steps.req.outputs.why }}" \
            "\`\`\`" \
            "" \
            "Fill the form in again at the build page and submit the issue it prepares. The page that filed this reads this comment, so it already knows nothing is building." \
            "" \
            "<!-- xgs-result: malformed -->")"

      # A request from anyone else: answered rather than ignored, and nothing is built. This is the
      # step the label gate used to skip, which is how a correct request from another account got
      # no reply of any kind.
      - name: It belongs in your own fork
        if: >-
          steps.req.outputs.request == 'true' &&
          github.event.issue.user.login != github.repository_owner
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment '${{ github.event.issue.number }}' --body "$(printf '%s\n' \
            "Nothing was built. That is this repository refusing, not a fault - and the page you filed this from reads this comment, so it has already told you." \
            "" \
            "Builds here only run for the account that owns this repository, so that a request cannot spend somebody else's Actions minutes. Two ways to get your own, and the first is one press:" \
            "" \
            "- On the build page, open **Fork and build in my account** and give it a GitHub token. It forks this repository for you, turns workflows on for the fork, builds there and hands you the image. Nothing else to do." \
            "- Or by hand: fork this repository; open the fork's **Actions** tab and enable workflows, which GitHub disables on every new fork; set **Settings -> Pages -> branch \`main\`, folder \`/docs\`**; then use your fork's copy of the build page." \
            "" \
            "Either way it is your build, your artifact, your storage - the licence position in CONTRIBUTING.md." \
            "" \
            "<!-- xgs-result: declined -->")"
