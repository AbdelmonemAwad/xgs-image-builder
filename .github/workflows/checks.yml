name: checks

# What a change here has to survive. Everything is cheap and deterministic: it parses files and
# compares them with each other.
#
# IT DOES NOT BUILD AN IMAGE and cannot. There is no Sophos appliance on a GitHub runner, and the
# build needs a FreeBSD guest and a gigabyte of download. A green tick here says the scripts parse,
# the request parser refuses what it should, the page and the workflow offer the same choices, and
# the page drives a mocked GitHub the way it should. It says nothing about whether an image boots,
# and nothing about GitHub's real API.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell parses
        run: |
          for f in scripts/*.sh tools/*.sh; do
            [ -f "$f" ] || continue
            sh -n "$f" && echo "ok $f"
          done

      # sh -n is not enough on its own and this repository has the scar: a ${ } expansion holding a
      # command substitution parses and then dies with "Bad substitution" at run time, in a branch
      # that only fires on a small image. So the scripts are also exercised where they can be.
      - name: Python parses
        run: |
          python3 -m compileall -q tools/*.py
          python3 -m pip install --quiet pyflakes
          python3 -m pyflakes tools/*.py

      - name: Workflows parse
        run: |
          python3 - <<'PY'
          import sys, yaml, pathlib
          bad = 0
          for p in sorted(pathlib.Path('.github/workflows').glob('*.yml')):
              try:
                  yaml.safe_load(p.read_text(encoding='utf-8'))
                  print('ok', p)
              except Exception as exc:
                  print('FAIL', p, exc); bad = 1
          sys.exit(bad)
          PY

      # The page and the workflow each carry the list of choices, because GitHub renders a
      # workflow's inputs and a static page cannot read them. Two lists that must agree need
      # something comparing them.
      - name: The page offers what the build accepts
        run: python3 tools/check-options.py .

      # Including the cases that found an output-injection bug in the refusal path.
      - name: The request parser refuses what it should
        run: sh tools/test-read-request.sh

      # The defect that killed the first build that ever ran, and the step that was supposed to
      # explain it: a commit subject containing an apostrophe, pasted into shell source by GitHub
      # before any shell saw it. There is no quoting that survives a value somebody else chose,
      # because the quoting is part of the same text. This allows no exceptions.
      - name: No workflow pastes a value into a script
        run: python3 tools/check-no-interpolation.py .

      # The one step with a dependency, and the one that needs a browser. It exists because the
      # page stopped being a form: it holds a token, calls api.github.com, turns status codes into
      # sentences and polls for a run it has to recognise as its own. None of that shows in a diff.
      # GitHub's API is mocked, so this spends no token and no Actions minutes - and so it proves
      # the page's logic and nothing about GitHub's real behaviour.
      - name: The build page does what it says
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          node tools/test-build-page.mjs
