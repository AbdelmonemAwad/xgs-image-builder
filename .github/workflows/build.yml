name: Build image

# Build a bootable OPNsense image for a Sophos XGS appliance, from the dropdowns below.
#
# THE RESULT IS AN ARTIFACT, and it expires. Nothing in this repository holds any part of an
# OPNsense image: the build fetches the official one from OPNsense's own mirror, verifies it, and
# adds this project's files to it. Running a workflow needs write access, so anyone else forks this
# and runs it in their own account. The ready-made images are this same build, called by
# release-images.yml, which publishes what it makes as a release - see CONTRIBUTING.md.
#
# NOTHING BUILT HERE HAS BEEN BOOTED ON AN APPLIANCE. A GitHub runner has no Sophos hardware
# attached to it. Burn an image and boot it before relying on it.

on:
  workflow_dispatch:
    inputs:
      # Only releases the driver can be built on. It uses FreeBSD 15's IPsec offload interface
      # (netipsec/ipsec_offload.h, IFCAP2_IPSEC_OFFLOAD), which OPNsense has from 26.7 on: 26.1 and
      # 25.x are FreeBSD 14.x, where the module does not compile, so an image of them would boot
      # with no front ports and, on an XGS 3300, no WAN. Checked against opnsense/src's stable
      # branches, not assumed. A newer release goes in here once it is published and checked.
      opnsense_version:
        description: 'OPNsense release (26.7 and later: the driver needs FreeBSD 15)'
        type: choice
        default: '26.7'
        options: [ '26.7' ]
      image_type:
        description: 'Image type - serial for an appliance with no screen (dvd is refused, see README)'
        type: choice
        default: 'serial'
        options: [ 'serial', 'nano', 'vga', 'dvd' ]
      console_speed:
        description: 'Serial console baud - Sophos firmware uses 38400, OPNsense defaults to 115200'
        type: choice
        default: '115200'
        options: [ '115200', '38400' ]
      serial_console:
        description: 'Put the console on the serial port only'
        type: choice
        default: 'yes'
        options: [ 'yes', 'no' ]
      # One image cannot tell from inside a build whether the appliance it will boot on has a
      # front panel, and the owner can: the rack models (the XGS 3300) have an LCD and keys, the
      # desktop ones (the XGS 136) have none. So it is asked here, and the image carries the front
      # panel plugin and LCDproc only when the answer is yes.
      front_panel:
        description: 'The appliance has a front panel (LCD and keys) - adds the front panel plugin and LCDproc'
        type: choice
        default: 'no'
        options: [ 'no', 'yes' ]
      # latest is the project's newest release - what every appliance's Updates page offers - so
      # an image starts where an update would take it. A commit, tag or branch still works.
      project_ref:
        description: 'os-xgs-npu to install: latest (the newest release), or a commit, tag or branch'
        type: string
        default: 'latest'
      build_id:
        description: 'Left empty here. The build page fills it in so it can find this run again.'
        type: string
        default: ''
  # The same build, called by release-images.yml for the ready-made images published with each
  # os-xgs-npu release. A called workflow takes no choice inputs, so these are strings, and
  # release-images.yml passes only values the lists above offer.
  workflow_call:
    inputs:
      opnsense_version: { type: string, default: '26.7' }
      image_type: { type: string, default: 'serial' }
      console_speed: { type: string, default: '115200' }
      serial_console: { type: string, default: 'yes' }
      front_panel: { type: string, default: 'no' }
      project_ref: { type: string, default: 'latest' }
      build_id: { type: string, default: '' }

# A workflow_dispatch answers 204 and hands back no run id, so a caller that wants to watch its own
# build has nothing to match on. The page generates a build_id, sends it, and then looks for the run
# whose name ends with it.
#
# It is appended plainly rather than through a conditional expression: an expression that is wrong
# fails the run, and there is no way to try one from outside Actions. Dispatched from the Actions
# page, build_id is empty and this is the name it has always had, with a trailing space nobody sees.
run-name: ${{ inputs.opnsense_version }} ${{ inputs.image_type }} at ${{ inputs.console_speed }} ${{ inputs.build_id }}

permissions:
  contents: read

jobs:
  build:
    name: ${{ inputs.opnsense_version }} ${{ inputs.image_type }} at ${{ inputs.console_speed }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # For the image's build attestation, below, and for nothing else: a short-lived token from
    # GitHub's OIDC provider to sign it with, and the right to store it.
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v7

      # An installer ISO is read-only cd9660. Repacking one bootable is separate work, and whether
      # files injected into an installer reach the INSTALLED system is unverified - so an ISO that
      # boots and silently carries none of this would look like success. Refuse early and say so.
      - name: Refuse dvd
        if: inputs.image_type == 'dvd'
        run: |
          echo "image_type=dvd is not implemented." >&2
          echo "" >&2
          echo "The installer ISO is read-only cd9660, repacking it bootable is a separate piece" >&2
          echo "of work, and whether files injected into an installer image reach the installed" >&2
          echo "system has not been verified. An image that boots and carries none of the driver" >&2
          echo "would look like it worked, which is the worst outcome available." >&2
          echo "" >&2
          echo "Use serial, nano or vga. For an appliance with no screen, serial." >&2
          exit 1

      # Fail in seconds on a combination the release does not publish, rather than in the guest
      # forty minutes later. This reads the release's own checksum file and selects from it.
      # Fail in seconds on a combination the release does not publish, rather than in the guest
      # forty minutes later with a 404.
      #
      # NOTHING BELOW PASTES A VALUE INTO A SCRIPT. GitHub substitutes `${{ ... }}` into the text of
      # a run block before any shell sees it, so whatever the value contains becomes code. That is
      # not a theory here: the first build that ever ran died on a commit subject containing an
      # apostrophe, and so did the step meant to explain the death. Values arrive through `env:` and
      # are read as $NAME; tools/check-no-interpolation.py fails the build if one creeps back in.
      - name: Resolve the upstream image
        id: release
        env:
          OPN_VERSION: ${{ inputs.opnsense_version }}
          IMAGE_TYPE: ${{ inputs.image_type }}
        run: |
          set -eu
          sh scripts/resolve-release.sh "$OPN_VERSION" "$IMAGE_TYPE" > /tmp/release
          {
            echo "url=$(sed -n 1p /tmp/release)"
            echo "file=$(sed -n 2p /tmp/release)"
            echo "sha256=$(sed -n 3p /tmp/release)"
          } >> "$GITHUB_OUTPUT"
          cat /tmp/release

      - name: Fetch os-xgs-npu
        id: project
        env:
          PROJECT_REF: ${{ inputs.project_ref }}
        run: |
          set -eu
          stamp=$(sh scripts/fetch-project.sh "$PROJECT_REF" project)
          echo "stamp=${stamp}" >> "$GITHUB_OUTPUT"
          echo "installing os-xgs-npu ${stamp}"

      # The rest of what goes into the image - the Arabic translation, the right-to-left layout, the
      # XGS Silicon theme and the plugins - each from its own repository at the ref components.list gives, each
      # recorded by commit in components/STAMPS. What they are is that list; the order they are
      # installed in is the first-boot hook in scripts/inject.sh, because that order matters.
      - name: Fetch the components
        run: |
          set -eu
          sh scripts/fetch-components.sh components.list components

      # A forty-minute pipeline that moves gigabytes inside a guest, whose log is its only witness,
      # has to say where it is and what it has left.
      - name: Space before the guest starts
        run: |
          df -h /
          echo "workspace: $(du -sh "${GITHUB_WORKSPACE}" 2>/dev/null | cut -f1)"

      # Everything that touches the filesystem happens in here, because an OPNsense image is UFS
      # and Linux's UFS write support is not something to put a firewall's boot device behind.
      #
      # sync: sshfs shares the workspace instead of copying it in and out, which matters because
      # the decompressed image is over two gigabytes. The download and the recompression happen in
      # the guest too, so the large files never cross the boundary.
      #
      # `envs:` is what carries the names across the ssh connection into the guest. If one of them
      # failed to arrive, `set -u` stops the script on the first use and says which - a loud
      # failure rather than a build made from an empty value.
      - name: Inject, in a FreeBSD guest
        uses: vmactions/freebsd-vm@v1
        env:
          OPN_URL: ${{ steps.release.outputs.url }}
          OPN_FILE: ${{ steps.release.outputs.file }}
          OPN_SHA: ${{ steps.release.outputs.sha256 }}
          CONSOLE_SPEED: ${{ inputs.console_speed }}
          SERIAL_CONSOLE: ${{ inputs.serial_console }}
          FRONT_PANEL: ${{ inputs.front_panel }}
          PROJ_STAMP: ${{ steps.project.outputs.stamp }}
          # The front panel in the name: the two ready-made images of a release differ by it alone.
          OUT_NAME: xgs-image-based-on-opnsense-${{ inputs.opnsense_version }}-${{ inputs.image_type }}-${{ inputs.console_speed }}${{ inputs.front_panel == 'yes' && '-front-panel' || '' }}.img
        with:
          release: '14.2'
          sync: sshfs
          copyback: true
          envs: 'OPN_URL OPN_FILE OPN_SHA CONSOLE_SPEED SERIAL_CONSOLE FRONT_PANEL PROJ_STAMP OUT_NAME'
          run: |
            set -eu
            cd "${GITHUB_WORKSPACE}"

            stage() { echo; echo "=== $1"; df -h . 2>/dev/null || true; }

            stage download
            fetch -o "${OPN_FILE}" "${OPN_URL}"
            ls -lh "${OPN_FILE}"

            stage verify
            # A firewall's boot device is on the other end of this.
            got=$(sha256 -q "${OPN_FILE}")
            if [ "${got}" != "${OPN_SHA}" ]; then
              echo "checksum mismatch for ${OPN_FILE}" >&2
              echo "  expected ${OPN_SHA}" >&2
              echo "  got      ${got}" >&2
              exit 1
            fi
            echo "sha256 ok"

            stage decompress
            bunzip2 -f "${OPN_FILE}"
            img=${OPN_FILE%.bz2}
            ls -lh "${img}"

            stage inject
            sh scripts/inject.sh \
              "${img}" \
              "${CONSOLE_SPEED}" \
              "${SERIAL_CONSOLE}" \
              "${GITHUB_WORKSPACE}/project" \
              "${PROJ_STAMP}" \
              "${GITHUB_WORKSPACE}/components" \
              "${FRONT_PANEL}"

            stage repack
            mv "${img}" "${OUT_NAME}"
            # xz writes the compressed file beside the original and removes it only at the end, so
            # the high-water mark here is both of them at once.
            xz -T0 -6 "${OUT_NAME}"

            stage done
            ls -lh "${OUT_NAME}.xz"

      # Reports whatever is known, including after a failure - so it must not be able to fail itself
      # and turn one red step into two. Which is exactly what it did: it carried the same commit
      # subject, in the same single quotes, and died of the same apostrophe.
      - name: Say what this is and what it is not
        if: always()
        continue-on-error: true
        env:
          OPN_VERSION: ${{ inputs.opnsense_version }}
          IMAGE_TYPE: ${{ inputs.image_type }}
          CONSOLE_SPEED: ${{ inputs.console_speed }}
          SERIAL_CONSOLE: ${{ inputs.serial_console }}
          FRONT_PANEL: ${{ inputs.front_panel }}
          OPN_FILE: ${{ steps.release.outputs.file }}
          PROJ_STAMP: ${{ steps.project.outputs.stamp }}
        run: |
          df -h / || true
          {
            printf '### Image\n\n'
            printf '| | |\n|---|---|\n'
            printf '| OPNsense | `%s` `%s` |\n' "$OPN_VERSION" "$IMAGE_TYPE"
            printf '| console | `%s` baud, serial only: `%s` |\n' "$CONSOLE_SPEED" "$SERIAL_CONSOLE"
            printf '| front panel | `%s` - the plugin and LCDproc are in the image only for yes |\n' "$FRONT_PANEL"
            printf '| os-xgs-npu | `%s` |\n' "$PROJ_STAMP"
            if [ -f components/STAMPS ]; then
              while read -r name commit rest; do
                printf '| %s | `%s` %s |\n' "$name" "$(printf '%s' "$commit" | cut -c1-12)" "$(printf '%s' "$rest" | cut -c27-90)"
              done < components/STAMPS
            fi
            printf '| upstream file | `%s` |\n' "$OPN_FILE"
            printf '| checksum | verified against the list the release publishes |\n\n'
            printf '> **This image has not been booted on an appliance.** A GitHub runner has no\n'
            printf '> Sophos hardware attached to it. Burn it and boot it before relying on it.\n\n'
            printf 'It carries the driver **sources** and the kernel sources for its own kernel, and\n'
            printf 'builds the module on the appliance at first boot. It carries no prebuilt module:\n'
            printf 'one built against a different kernel loads without complaining and then reads\n'
            printf 'structures at the wrong offsets.\n\n'
            printf 'Every family is installed. The selection happens at first boot, by guards that\n'
            printf 'already exist in the project. See `docs/board-maps.md`.\n\n'
            printf 'With it: the Arabic translation and the right-to-left layout (the GUI stays in\n'
            printf 'English until Arabic is chosen), the XGS Silicon theme as the GUI theme, three\n'
            printf 'plugins, and - when the front panel was\n'
            printf 'asked for - the front panel plugin with the LCDproc packages it needs. All installed\n'
            printf 'at first boot, in order, and each keeps itself across OPNsense updates with a pkg\n'
            printf 'trigger and a boot hook of its own.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      # A statement signed through GitHub and kept by it: this file, by its digest, was built by this
      # workflow, from this commit, in this repository - what `gh attestation verify` checks. It
      # says where an image came from, not that it is good; the summary above says what is in it.
      # A private repository has no attestations on GitHub's free plans, so a private fork skips
      # this rather than failing the build it would only describe.
      - name: Attest the image
        if: github.event.repository.private != true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: '*.img.xz'

      - uses: actions/upload-artifact@v7
        with:
          name: xgs-image-based-on-opnsense-${{ inputs.opnsense_version }}-${{ inputs.image_type }}-${{ inputs.console_speed }}${{ inputs.front_panel == 'yes' && '-front-panel' || '' }}
          path: '*.img.xz'
          retention-days: 7
          if-no-files-found: error
