name: Answer a finished request

# When a build a request started has finished, say so on the request and close it.
#
# build-from-issue.yml answers a request the moment it starts the build ("Build started") and nothing
# came back to it after that: every request stayed open, the one of 2026-10-16 among them four days
# later, and the list of open issues was a list of builds that had long ended. The run carries the
# request's build_id at the end of its name (build.yml's run-name), so the request is found by that,
# answered with how the run ended and where the image is, and closed.
#
# The build page reads only the FIRST comment of a request - "started", "declined" or "malformed" -
# and follows the run itself from there, finding the request among open and closed issues alike, so
# a second comment and a closed issue change nothing for a reader still watching. This comment ends
# with a marker too, `built` or `failed`, for anything that reads them later.
#
# NOTHING BELOW PASTES A VALUE INTO A SCRIPT: the run's name is free text, so every value arrives
# through `env:` (tools/check-no-interpolation.py).

on:
  workflow_run:
    workflows: [ "Build image" ]
    types: [ completed ]

permissions:
  issues: write

jobs:
  answer:
    runs-on: ubuntu-latest
    steps:
      - name: Answer the request this run was started for
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TITLE: ${{ github.event.workflow_run.display_title }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -eu
          id=$(printf '%s\n' "$TITLE" | awk '{print $NF}')
          if ! printf '%s' "$id" | grep -Eq '^web-[a-z0-9-]+$'; then
            echo "Not started by a request. Nothing to answer." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # The open requests' bodies, matched here rather than through GitHub's search, whose index
          # can lag behind a request filed a minute ago; the id reaches jq as a value, not as code.
          n=$(gh issue list -R "$REPO" --state open --limit 100 --json number,body |
              jq -r --arg id "$id" '[.[] | select(.body | contains($id))][0].number // empty')
          if [ -z "$n" ]; then
            echo "No open request carries ${id}." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$CONCLUSION" = success ]; then
            body=$(printf '%s\n' \
              "Built. The image is the artifact on [this run](${RUN_URL}), and expires on its own." \
              "" \
              "It has not been booted on an appliance. Burn it and boot it before relying on it." \
              "" \
              "<!-- xgs-result: built -->")
            reason=completed
          else
            body=$(printf '%s\n' \
              "The build did not finish: it ended \`${CONCLUSION}\`. [The run](${RUN_URL}) says where; file the request again from the build page once that is put right." \
              "" \
              "<!-- xgs-result: failed -->")
            reason="not planned"
          fi
          gh issue comment "$n" -R "$REPO" --body "$body"
          gh issue close "$n" -R "$REPO" --reason "$reason"
          echo "Request #${n} answered (${CONCLUSION}) and closed." >> "$GITHUB_STEP_SUMMARY"
