<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Update OPNsense right after installing - PHP2Shell: update OPNsense to PHP 8.5.12 or later at the first boot, test appliances included">
  <rect x="1" y="1" width="1198" height="298" rx="14" fill="#FFEBE9" stroke="#CF222E" stroke-width="2"/>
  <rect x="1" y="1" width="10" height="298" rx="5" fill="#CF222E"/>
  <g transform="translate(52 44)">
    <path d="M36 4 L70 64 L2 64 Z" fill="none" stroke="#CF222E" stroke-width="5" stroke-linejoin="round"/>
    <rect x="33" y="24" width="6" height="22" rx="3" fill="#CF222E"/>
    <circle cx="36" cy="54" r="3.6" fill="#CF222E"/>
  </g>
  <text x="150" y="74" font-family="ui-sans-serif,-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="32" font-weight="700" fill="#1F2328" letter-spacing="-0.5">Update OPNsense right after installing - PHP2Shell</text>
  <text x="152" y="102" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="600" fill="#CF222E">CRITICAL &#183; CVE-2026-109618 &#183; CVE-2026-109619</text>
  <text x="150" y="136" font-family="ui-sans-serif,-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#1F2328">Every image here starts from OPNsense 26.7&#8217;s own image and carries its PHP - older than the fix.</text>
  <text x="150" y="166" font-family="ui-sans-serif,-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#59636E">Two PHP flaws can let code run on the firewall without a login, and its web interface runs on PHP.</text>
  <text x="150" y="196" font-family="ui-sans-serif,-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#1F2328">First boot: System &#8250; Firmware &#8250; Status &#8250; Check for updates &#8250; Update - a test appliance too.</text>
  <text x="150" y="226" font-family="ui-sans-serif,-apple-system,Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#59636E">Since 26.7.8 the update carries the fix: the version reads 26.7.8 after it.</text>
  <rect x="150" y="248" width="380" height="34" rx="8" fill="#F6F8FA" stroke="#D0D7DE"/>
  <text x="166" y="271" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="400" fill="#1F2328">php -v  &#8594;  8.5.12 or later</text>
</svg>
